<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c2185b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MensTrack">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>MensTrack</title>
</head>
<body>
  <main>
    <header>
      <h1>MensTrack</h1>
    </header>

    <section class="card summary" aria-live="polite">
      <div id="headline" class="headline"></div>
      <div id="subline" class="subline"></div>
      <div id="stats" class="stats"></div>
      <button id="log-today" class="primary" type="button">Log today</button>
    </section>

    <section class="card">
      <div class="cal-nav">
        <button id="prev" type="button" aria-label="Previous month">&lsaquo;</button>
        <button id="month-title" type="button" class="month-title" aria-label="Jump to today"></button>
        <button id="next" type="button" aria-label="Next month">&rsaquo;</button>
      </div>
      <div id="weekdays" class="grid weekdays"></div>
      <div id="days" class="grid days"></div>
      <ul class="legend">
        <li><span class="dot period"></span>Period</li>
        <li><span class="dot predicted"></span>Predicted</li>
        <li><span class="dot fertile"></span>Fertile (estimate)</li>
        <li><span class="dot ovulation"></span>Ovulation (estimate)</li>
      </ul>
    </section>

    <section class="card data">
      <h2>Your data</h2>
      <p class="muted">Stored only on this device. Export a backup from time to time.</p>
      <div class="row">
        <button id="export" type="button">Export</button>
        <button id="import" type="button">Import</button>
        <input id="import-file" type="file" accept="application/json,.json" hidden>
      </div>
      <p class="muted small">Predictions are estimates based on your past cycles and are not medical advice or contraception.</p>
    </section>
  </main>

  <dialog id="sheet">
    <form id="sheet-form">
      <h2 id="sheet-title"></h2>

      <label class="toggle">
        <input id="f-period" type="checkbox">
        <span>Period day</span>
      </label>

      <fieldset id="flow-set">
        <legend>Flow</legend>
        <div class="segmented">
          <label><input type="radio" name="flow" value="1"><span>Light</span></label>
          <label><input type="radio" name="flow" value="2"><span>Medium</span></label>
          <label><input type="radio" name="flow" value="3"><span>Heavy</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Symptoms</legend>
        <div id="symptoms" class="chips"></div>
      </fieldset>

      <label class="note">
        <span>Note</span>
        <textarea id="f-note" rows="3" maxlength="500"></textarea>
      </label>

      <div class="row">
        <button id="sheet-cancel" type="button">Cancel</button>
        <button id="sheet-clear" type="button" class="danger">Clear</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
